<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto Classic Maintenance Templates • Showcase</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234F46E5'/><path d='M30 35h40a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H45L30 78V41a6 6 0 0 1 6-6z' fill='%23FFFFFF'/><circle cx='42' cy='52' r='4' fill='%234F46E5'/><circle cx='58' cy='52' r='4' fill='%234F46E5'/></svg>">
  <style>
    :root {
      --bar-bg: #0c1017;
      --border: #1f2937;
      --text-1: #f9fafb;
      --text-2: #9ca3af;
      --primary: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Switcher Bar */
    header.switch-bar {
      height: 60px;
      padding: 0 24px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-badge svg { width: 16px; height: 16px; fill: #fff; }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
    }
    .category-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1f2937;
      color: #cbd5e1;
    }

    /* Template Tabs */
    .tabs-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active {
      background: #1f2937;
      color: #fff;
      font-weight: 600;
    }

    /* Actions */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }
    .dev-btn {
      background: none;
      border: none;
      color: var(--text-2);
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s;
    }
    .dev-btn:hover { color: #fff; }
    .dev-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .dev-btn svg { width: 15px; height: 15px; }

    .btn-action-primary {
      background: #f3f4f6;
      color: #111827;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-action-primary:hover { background: #e5e7eb; }

    /* Viewport Area */
    .viewport-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090e;
      overflow: hidden;
      position: relative;
    }
    .viewport-frame {
      width: 100%;
      height: 100%;
      border: none;
      transition: all 0.25s ease;
    }
    .viewport-frame.tablet {
      width: 768px;
      height: 94%;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .viewport-frame.mobile {
      width: 390px;
      height: 92%;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- Top Switcher -->
  <header class="switch-bar">
    <div class="brand-section">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      </div>
      <div class="brand-name">Connecto</div>
      <span class="category-badge">CLASSIC TEMPLATES</span>
    </div>

    <!-- Switcher Tabs -->
    <div class="tabs-group">
      <button class="tab-btn active" id="tab-c1" onclick="switchTemplate('c1')">
        <span>Classic 1: Clean Standard</span>
      </button>
      <button class="tab-btn" id="tab-c2" onclick="switchTemplate('c2')">
        <span>Classic 2: Structured Incident</span>
      </button>
      <button class="tab-btn" id="tab-c3" onclick="switchTemplate('c3')">
        <span>Classic 3: Minimal Editorial</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions-group">
      <div class="device-switcher">
        <button class="dev-btn active" id="dev-desktop" onclick="setDevice('desktop')" title="Desktop View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button class="dev-btn" id="dev-tablet" onclick="setDevice('tablet')" title="Tablet View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
        </button>
        <button class="dev-btn" id="dev-mobile" onclick="setDevice('mobile')" title="Mobile View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
        </button>
      </div>

      <button class="btn-action-primary" onclick="openStandalone()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span>Open Standalone</span>
      </button>
    </div>
  </header>

  <!-- Viewport -->
  <main class="viewport-container">
    <iframe class="viewport-frame" id="preview-frame" src="/static/maintenance_classic_1.html"></iframe>
  </main>

  <script>
    let activeTpl = 'c1';

    const tplUrls = {
      'c1': '/static/maintenance_classic_1.html',
      'c2': '/static/maintenance_classic_2.html',
      'c3': '/static/maintenance_classic_3.html'
    };

    function switchTemplate(id) {
      activeTpl = id;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      document.getElementById('preview-frame').src = tplUrls[id];
    }

    function setDevice(device) {
      document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('dev-' + device).classList.add('active');

      const frame = document.getElementById('preview-frame');
      frame.className = 'viewport-frame ' + (device === 'desktop' ? '' : device);
    }

    function openStandalone() {
      window.open(tplUrls[activeTpl], '_blank');
    }
  </script>
</body>
</html>
