<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto Maintenance Templates • Interactive Showcase</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%236366F1'/><path d='M30 35h40a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H45L30 78V41a6 6 0 0 1 6-6z' fill='%23FFFFFF'/><circle cx='42' cy='52' r='4' fill='%236366F1'/><circle cx='58' cy='52' r='4' fill='%236366F1'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bar-bg: rgba(10, 14, 24, 0.92);
      --indigo: #6366f1;
      --cyan: #38bdf8;
      --emerald: #10b981;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080e;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Master Top Switcher Bar */
    header.switch-bar {
      height: 64px;
      padding: 0 24px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-badge svg { width: 17px; height: 17px; fill: #fff; }
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-name span { color: var(--cyan); }
    .template-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }

    /* Template Tabs */
    .tabs-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .tab-btn.active.term-style {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }

    /* Actions */
    .actions-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .dev-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }
    .dev-btn:hover { color: #fff; }
    .dev-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .dev-btn svg { width: 16px; height: 16px; }

    .btn-action-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-action-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    /* Viewport Area */
    .viewport-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020408;
      overflow: hidden;
      position: relative;
    }
    .viewport-frame {
      width: 100%;
      height: 100%;
      border: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .viewport-frame.tablet {
      width: 768px;
      height: 94%;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .viewport-frame.mobile {
      width: 390px;
      height: 92%;
      border-radius: 36px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Top Switcher -->
  <header class="switch-bar">
    <div class="brand-section">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      </div>
      <div class="brand-name">connecto<span>.fun</span></div>
      <span class="template-badge">TEMPLATE STUDIO</span>
    </div>

    <!-- Switcher Tabs -->
    <div class="tabs-group">
      <button class="tab-btn active" id="tab-1" onclick="switchTemplate(1)">
        <span>✨ Template 1: Cyber Aurora</span>
      </button>
      <button class="tab-btn" id="tab-2" onclick="switchTemplate(2)">
        <span>⚡ Template 2: Mission Control</span>
      </button>
      <button class="tab-btn" id="tab-3" onclick="switchTemplate(3)">
        <span>💎 Template 3: Studio Luxury</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions-group">
      <div class="device-switcher">
        <button class="dev-btn active" id="dev-desktop" onclick="setDevice('desktop')" title="Desktop View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button class="dev-btn" id="dev-tablet" onclick="setDevice('tablet')" title="Tablet View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
        </button>
        <button class="dev-btn" id="dev-mobile" onclick="setDevice('mobile')" title="Mobile View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
        </button>
      </div>

      <button class="btn-action-primary" onclick="openCurrentTemplateStandalone()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span>Open Standalone</span>
      </button>
    </div>
  </header>

  <!-- Viewport -->
  <main class="viewport-container">
    <iframe class="viewport-frame" id="preview-frame" src="/static/maintenance_template_1.html"></iframe>
  </main>

  <script>
    let activeTpl = 1;
    let activeDev = 'desktop';

    const tplUrls = {
      1: '/static/maintenance_template_1.html',
      2: '/static/maintenance_template_2.html',
      3: '/static/maintenance_template_3.html'
    };

    function switchTemplate(id) {
      activeTpl = id;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active', 'term-style');
      });
      const btn = document.getElementById('tab-' + id);
      btn.classList.add('active');
      if (id === 2) btn.classList.add('term-style');

      document.getElementById('preview-frame').src = tplUrls[id];
    }

    function setDevice(device) {
      activeDev = device;
      document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('dev-' + device).classList.add('active');

      const frame = document.getElementById('preview-frame');
      frame.className = 'viewport-frame ' + (device === 'desktop' ? '' : device);
    }

    function openCurrentTemplateStandalone() {
      window.open(tplUrls[activeTpl], '_blank');
    }
  </script>
</body>
</html>
